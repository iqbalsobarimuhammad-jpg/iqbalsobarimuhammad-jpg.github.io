<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Sumpah Bara: JRPG pixel art tentang Nusantara, terinspirasi sejarah Majapahit.">
<title>Sumpah Bara</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #8f8676; font: 16px system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<div id="loading">Memuat...</div>
<div id="game"></div>
<noscript><p style="color:#ccc;text-align:center">Game ini butuh JavaScript.</p></noscript>
<script src="lib/phaser.min.js"></script>
<script type="module">
  import './src/main.js';
  document.getElementById('loading').remove();
</script>
</body>
</html>
